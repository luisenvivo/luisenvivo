<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualmente Offline</title>
  
  <!-- Fuente Inter desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: rgba(255, 255, 255, 0.02);
      --border-color: rgba(255, 255, 255, 0.07);
      --text-main: #f0f2f5;
      --text-muted: #8a929e;
      --accent-offline: #6e7681;
      --accent-glow: rgba(110, 118, 129, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      background-image: 
        radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.03) 0%, transparent 60%);
      overflow: hidden;
    }

    .offline-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .badge-wrapper {
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-offline);
      position: relative;
    }

    .dot::after {
      content: '';
      position: absolute;
      top: -3px;
      left: -3px;
      right: -3px;
      bottom: -3px;
      border-radius: 50%;
      background-color: var(--accent-offline);
      opacity: 0.4;
      animation: pulse 2.5s infinite ease-in-out;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 500;
      letter-spacing: -0.5px;
      margin-bottom: 0.85rem;
      color: var(--text-main);
    }

    p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      font-weight: 300;
      max-width: 340px;
      margin: 0 auto 2rem auto;
    }

    .divider {
      height: 1px;
      width: 60px;
      background: var(--border-color);
      margin: 0 auto;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.3;
      }
      50% {
        transform: scale(1.8);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <main class="offline-card">
    <div class="badge-wrapper">
      <div class="badge">
        <span class="dot"></span>
        <span>OFFLINE</span>
      </div>
    </div>
    
    <h1>Actualmente Offline</h1>
    <p>La transmisión o sesión ha finalizado. Regresa más tarde para ver nuevo contenido.</p>
    
    <div class="divider"></div>
  </main>

</body>
</html>
